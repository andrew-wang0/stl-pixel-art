[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stl-pixel-art"
version = "0.1.0"
description = "Aligned multi-color STL parts from indexed PNG pixel art"
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "numpy>=1.24", "trimesh>=4"]

[project.scripts]
stl-pixel-art = "pixel_art:main"

[tool.setuptools]
py-modules = ["pixel_art"]
